name: 实验4 · 自动部署到阿里云 ECS

on:
  push:
    branches: [ main ]
    paths: [ 'web-app/**', 'dist/**', '.github/workflows/deploy-ecs.yml' ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 前端构建，产物准备上传
      - name: 构建前端
        working-directory: web-app/frontend
        run: |
          npm ci || npm install
          npm run build

      # 上传前端构建产物到 ECS 的 Nginx 目录
      - name: 上传前端静态资源
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "web-app/frontend/dist/*"
          target: /var/www/html
          strip_components: 3

      # 上传后端代码到 /opt/web-app/backend
      - name: 上传后端代码
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "web-app/backend/*"
          target: /opt/web-app/backend
          strip_components: 2

      # 远程安装依赖并重启后端服务（pm2 守护）
      - name: 重启后端服务
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            cd /opt/web-app/backend
            npm ci --registry=https://registry.npmmirror.com || npm install --registry=https://registry.npmmirror.com
            (pm2 restart backend 2>/dev/null || pm2 start server.mjs --name backend)
            sleep 1
            curl -s http://127.0.0.1:3000/api/health
            echo "--- nginx 验证 ---"
            curl -s http://127.0.0.1/api/health
