<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI/CD 实验静态页面</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0d1b35, #1e66f5);
      color: #fff;
    }
    .card {
      text-align: center;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 18px;
      padding: 48px 64px;
      backdrop-filter: blur(8px);
    }
    h1 { margin: 0 0 12px; font-size: 30px; }
    p { margin: 4px 0; color: #c9d6ee; font-size: 15px; }
    .badge {
      display: inline-block;
      margin-top: 16px;
      padding: 6px 16px;
      border-radius: 999px;
      background: #12b886;
      font-weight: 700;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>GitHub Pages 自动部署成功</h1>
    <p>本页面由 GitHub Actions 工作流自动校验并发布</p>
    <p>实验：CI/CD 自动化与 GitHub Actions</p>
    <p class="meta" id="version">版本 v1 —— 首次部署</p>
    <span class="badge">DEPLOYED BY ACTIONS ✔</span>
  </div>
</body>
</html>
